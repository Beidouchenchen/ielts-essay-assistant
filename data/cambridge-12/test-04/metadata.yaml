    key_features:
      - 5 stages in geothermal power generation
      - cold water pumped down 4.5km through injection well
      - water heated by geothermal zone (hot rocks)
      - heated water rises through production well
      - steam powers turbine connected to generator
      - condenser cools water back to liquid for reuse
