    key_features:
      - 8-stage process from bamboo plant to fabric
      - Spring planting, autumn harvesting
      - Cutting into strips, crushing to liquid pulp
      - Filtering long fibres from liquid
      - Softening with water and amine oxide
      - Spinning into yarn, weaving into fabric

